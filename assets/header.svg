<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Mory Ndour — Étudiant en Licence Génie logiciel à l'ISI Dakar, créateur de SunuJëf et fondateur de Tawakul Digitale</title>
<desc id="d">Bannière sombre avec un soleil levant ocre : nom, formation et projets de Mory Ndour.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0E1116"/>
<stop offset="1" stop-color="#171C26"/>
</linearGradient>
<radialGradient id="glow" cx="0.83" cy="1" r="0.6">
<stop offset="0" stop-color="#E0A43A" stop-opacity="0.26"/>
<stop offset="1" stop-color="#E0A43A" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.2" fill="#F5F1E8" fill-opacity="0.055"/>
</pattern>
<clipPath id="c"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="440" fill="url(#bg)"/>
<rect width="1200" height="440" fill="url(#dots)"/>
<rect width="1200" height="440" fill="url(#glow)"/>
<!-- soleil levant -->
<g fill="none" stroke="#E0A43A" transform="translate(1000 440)">
<circle r="84"  stroke-width="2.4" stroke-opacity="0.95"/>
<circle r="132" stroke-width="1.8" stroke-opacity="0.55"/>
<circle r="180" stroke-width="1.4" stroke-opacity="0.32"/>
<circle r="228" stroke-width="1.2" stroke-opacity="0.18"/>
<circle r="276" stroke-width="1"   stroke-opacity="0.09"/>
</g>
<circle cx="1000" cy="440" r="56" fill="#E0A43A"/>
<!-- rayons -->
<g stroke="#E0A43A" stroke-opacity="0.22" stroke-width="1.4">
<line x1="1000" y1="440" x2="1000" y2="120"/>
<line x1="1000" y1="440" x2="862" y2="152"/>
<line x1="1000" y1="440" x2="1138" y2="152"/>
</g>
<line x1="660" y1="439" x2="1200" y2="439" stroke="#E0A43A" stroke-opacity="0.6" stroke-width="2"/>
</g>
<!-- repère -->
<text x="76" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#8B93A1">DAKAR · SÉNÉGAL</text>
<rect x="76" y="110" width="44" height="3" rx="1.5" fill="#E0A43A"/>
<!-- nom -->
<text x="70" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="-1.5" fill="#F5F1E8">Mory Ndour</text>
<!-- formation -->
<text x="76" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#E6E9EE">Étudiant en Licence 2 Génie logiciel <tspan fill="#E0A43A">·</tspan> ISI Dakar</text>
<text x="76" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#AEB5C0">Créateur de SunuJëf <tspan fill="#E0A43A">·</tspan> Fondateur de Tawakul Digitale</text>
<!-- signature -->
<text x="76" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B93A1"><tspan fill="#E0A43A">&gt;</tspan> j'apprends, je construis, j'entreprends<tspan fill="#E0A43A">_</tspan></text>
</svg>
